<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Stacked Scroll Cards — стопка карточек, которые при прокрутке по очереди улетают вверх, на GSAP и Lenis."
    />
    <title>Stacked Scroll Cards</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=DM+Mono&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>Enter the Frame</h1>
      </section>

      <section class="cards">
        <article class="card" style="--card-bg: #3d2fa9">
          <div class="card-text">
            <p>Quiet Control</p>
            <h3>Signal Drift</h3>
          </div>
          <div class="card-img">
            <img src="images/image-01.webp" alt="" width="800" height="1000" />
          </div>
        </article>
        <article class="card" style="--card-bg: #ff7722">
          <div class="card-text">
            <p>Fluid Structures</p>
            <h3>Skyline Drift</h3>
          </div>
          <div class="card-img">
            <img src="images/image-02.webp" alt="" width="800" height="1000" />
          </div>
        </article>
        <article class="card" style="--card-bg: #ff3d33">
          <div class="card-text">
            <p>Wired Thought</p>
            <h3>Neural Assembly</h3>
          </div>
          <div class="card-img">
            <img src="images/image-03.webp" alt="" width="800" height="1000" />
          </div>
        </article>
        <article class="card" style="--card-bg: #785f47">
          <div class="card-text">
            <p>Silent Repetition</p>
            <h3>Learning Loop</h3>
          </div>
          <div class="card-img">
            <img src="images/image-04.webp" alt="" width="800" height="1000" />
          </div>
        </article>
      </section>

      <section class="outro">
        <h2>Loop Complete</h2>
      </section>
    </main>
  </body>
</html>
